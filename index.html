<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVA Bypass - Premium Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #111111;
            --gold-primary: #ffaa00;
            --gold-secondary: #d4af37;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border-gold: rgba(255, 170, 0, 0.3);
            --telegram-blue: #0088cc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #050505 70%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 40px;
            border-bottom: 1px solid var(--border-gold);
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--gold-primary);
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.5);
            object-fit: cover;
            background: #000;
        }

        .brand-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .brand-name span {
            color: var(--gold-primary);
        }

        /* --- HEADER MENU (TITIK 3 & SETTINGS) --- */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 20px;
        }

        .icon-btn:hover {
            background: rgba(255, 170, 0, 0.2);
            border-color: var(--gold-primary);
            color: var(--gold-primary);
            transform: scale(1.05);
        }

        /* Dropdown Menu */
        .dropdown-menu {
            position: absolute;
            top: 60px;
            right: 0;
            background: var(--panel-bg);
            border: 1px solid var(--border-gold);
            border-radius: 10px;
            width: 200px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: none; /* Tersembunyi secara default */
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
        }

        .dropdown-menu.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .dropdown-item {
            padding: 15px 20px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dropdown-item:hover {
            background: rgba(255, 170, 0, 0.1);
            color: var(--gold-primary);
        }

        .dropdown-item.logout {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #ff4444;
        }
        
        .dropdown-item.logout:hover {
            background: rgba(255, 68, 68, 0.1);
            color: #ff4444;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- MAIN CONTENT --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
        }

        .hero-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 5px;
            background: linear-gradient(90deg, var(--gold-primary), var(--gold-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(255, 170, 0, 0.2);
        }

        .hero-subtitle {
            font-size: 20px;
            letter-spacing: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 50px;
        }

        /* Feature Cards */
        .features-grid {
            display: flex;
            gap: 30px;
            max-width: 900px;
            width: 100%;
            margin-bottom: 50px;
            justify-content: center;
        }

        .feature-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-gold);
            border-radius: 15px;
            padding: 30px;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255, 170, 0, 0.05), transparent);
            transform: translateX(-100%);
            transition: 0.5s;
        }

        .feature-card:hover::before {
            transform: translateX(100%);
        }

        .feature-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold-primary);
            box-shadow: 0 10px 30px rgba(255, 170, 0, 0.15);
        }

        .feature-icon {
            font-size: 30px;
            color: var(--gold-primary);
            background: rgba(255, 170, 0, 0.1);
            padding: 15px;
            border-radius: 10px;
        }

        .feature-text h3 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .feature-text p {
            color: var(--text-muted);
            font-size: 16px;
        }

        /* --- CTA BUTTON (BELI KEY) --- */
        .cta-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .buy-btn {
            background: linear-gradient(90deg, #b8860b, var(--gold-primary));
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            padding: 20px 60px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(255, 170, 0, 0.5);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            animation: pulse 2s infinite;
        }

        .buy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 170, 0, 0.9);
            background: linear-gradient(90deg, var(--gold-primary), #ffcc00);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 170, 0, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 170, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 170, 0, 0); }
        }

        /* --- FOOTER --- */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-top: 1px solid var(--border-gold);
            background: rgba(10, 10, 10, 0.8);
            color: var(--text-muted);
            font-size: 14px;
        }

        .footer-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff00;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            .hero-title { font-size: 40px; }
            .features-grid { flex-direction: column; }
            .buy-btn { padding: 15px 30px; font-size: 16px; width: 100%; justify-content: center;}
            footer { flex-direction: column; gap: 10px; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo-container">
            <!-- Ganti src dengan link logo SVA Anda -->
            <img src="[LOGO_SVA_ANDA]" alt="SVA Logo" class="logo-img">
            <div class="brand-name">SVA <span>BYPASS</span></div>
        </div>

        <div class="header-actions">
            <!-- Tombol Pengaturan -->
            <button class="icon-btn" title="Pengaturan">
                ⚙️
            </button>
            
            <!-- Tombol Titik 3 -->
            <button class="icon-btn" id="menuBtn" title="Menu">
                ⋮
            </button>

            <!-- Dropdown Menu Titik 3 -->
            <div class="dropdown-menu" id="dropdownMenu">
                <a href="#" class="dropdown-item">🏠 Home</a>
                <a href="#" class="dropdown-item">👤 Profile</a>
                <a href="#" class="dropdown-item">💬 Support</a>
                <a href="#" class="dropdown-item logout">🚪 Logout</a>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <h1 class="hero-title">SVA BYPASS</h1>
        <p class="hero-subtitle">Android Non-Root</p>

        <div class="features-grid">
            <div class="feature-card">
                <div class="feature-icon">🎮</div>
                <div class="feature-text">
                    <h3>Game</h3>
                    <p>PUBGM & BGMI</p>
                </div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🤖</div>
                <div class="feature-text">
                    <h3>Support</h3>
                    <p>Android Non-Root</p>
                </div>
            </div>
        </div>

        <div class="cta-container">
            <!-- Tombol Beli Key yang mengarah ke Telegram -->
            <a href="https://t.me/scp281025" target="_blank" class="buy-btn">
                🛒 BELI KEY SEKARANG
            </a>
            <p style="color: var(--text-muted); font-size: 14px;">Klik tombol di atas untuk membeli Key via Telegram</p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-status">
            <div class="status-dot"></div>
            <span>Safe & Secure - Android Non-Root</span>
        </div>
        <div>
            &copy; 2024 SVA Bypass. All rights reserved.
        </div>
    </footer>

    <!-- JAVASCRIPT UNTUK MENU TITIK 3 -->
    <script>
        // Mengambil elemen tombol dan menu
        const menuBtn = document.getElementById('menuBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');

        // Fungsi untuk membuka/menutup menu saat tombol titik 3 diklik
        menuBtn.addEventListener('click', function(event) {
            event.stopPropagation(); // Mencegah klik menyebar ke document
            dropdownMenu.classList.toggle('active');
        });

        // Menutup menu jika user mengklik di luar area menu
        document.addEventListener('click', function(event) {
            if (!dropdownMenu.contains(event.target) && event.target !== menuBtn) {
                dropdownMenu.classList.remove('active');
            }
        });
    </script>

</body>
</html>
